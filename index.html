<div class="countdown-container">
    <div class="countdown-title">Contando os dias até 17 de Outubro 🗓️</div>
    <div class="countdown-box">
        <div class="countdown-item">
            <span class="countdown-number" id="dias">00</span>
            <span class="countdown-label">Dias</span>
        </div>
        <div class="countdown-item">
            <span class="countdown-number" id="horas">00</span>
            <span class="countdown-label">Horas</span>
        </div>
        <div class="countdown-item">
            <span class="countdown-number" id="minutos">00</span>
            <span class="countdown-label">Min</span>
        </div>
        <div class="countdown-item">
            <span class="countdown-number" id="segundos">00</span>
            <span class="countdown-label">Seg</span>
        </div>
    </div>
    <div class="countdown-footer">para o nosso dia! ❤️</div>
</div>

<style>
    .countdown-container { background: #fff5f7; border: 2px dashed #d63384; border-radius: 15px; padding: 20px; text-align: center; max-width: 450px; margin: 25px auto; box-shadow: 0 4px 10px rgba(214, 51, 132, 0.05); }
    .countdown-title { color: #0056b3; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
    .countdown-box { display: flex; justify-content: center; gap: 12px; }
    .countdown-item { background: #0056b3; color: white; border-radius: 8px; padding: 10px; min-width: 65px; box-shadow: 0 4px 6px rgba(0, 86, 179, 0.2); }
    .countdown-number { display: block; font-size: 24px; font-weight: bold; font-family: sans-serif; }
    .countdown-label { font-size: 11px; text-transform: uppercase; opacity: 0.9; display: block; margin-top: 2px; }
    .countdown-footer { color: #d63384; font-weight: bold; margin-top: 15px; font-size: 15px; }
</style>

<script>
    const dataAlvo = new Date("Oct 17, 2026 00:00:00").getTime();
    const intervalo = setInterval(function() {
        const agora = new Date().getTime();
        const diferenca = dataAlvo - agora;
        const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((diferenca % (1000 * 60)) / 1000);
        document.getElementById("dias").innerHTML = dias < 10 ? "0" + dias : dias;
        document.getElementById("horas").innerHTML = horas < 10 ? "0" + horas : horas;
        document.getElementById("minutos").innerHTML = minutos < 10 ? "0" + minutos : minutos;
        document.getElementById("segundos").innerHTML = segundos < 10 ? "0" + segundos : segundos;
        if (diferenca < 0) {
            clearInterval(intervalo);
            document.querySelector(".countdown-box").style.display = "none";
            document.querySelector(".countdown-title").innerHTML = "Chegou o nosso grande dia! 🥰🎉";
            document.querySelector(".countdown-footer").style.display = "none";
        }
    }, 1000);
</script>
